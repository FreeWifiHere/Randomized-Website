  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');
    :root{--ink:#171713;--paper:#f1efe7;--lime:#c8ff4a;--muted:#77766e;--line:#cfcdc3}

    .brand{display:flex;align-items:center;gap:13px;font-weight:800;letter-spacing:-.04em;font-size:21px}.die{width:34px;height:34px;background:var(--ink);border-radius:9px;display:grid;place-items:center;color:var(--lime);font-family:DM Mono;font-size:16px;transform:rotate(-5deg)}
    .tag{font:500 11px DM Mono;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.controls{display:flex;align-items:center;gap:12px}

    .stage{min-height:calc(100vh - 82px);padding:28px 4vw 36px}.meta{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.eyebrow{font:500 11px DM Mono;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.type{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:5px}.count{font:500 12px DM Mono;color:var(--muted)}
    .viewport{height:min(68vh,720px);min-height:480px;border:1px solid #b9b7ae;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 20px 60px rgba(40,39,33,.13);position:relative}.browserbar{height:45px;background:#e4e2da;border-bottom:1px solid #cbc9c0;display:flex;align-items:center;padding:0 15px;gap:7px;position:relative;z-index:3}.dot{width:9px;height:9px;border-radius:50%;background:#aaa89f}.address{position:absolute;left:50%;transform:translateX(-50%);font:400 10px DM Mono;color:#77766e}.page{height:calc(100% - 45px);overflow:auto;position:relative}.page::-webkit-scrollbar{width:7px}.page::-webkit-scrollbar-thumb{background:#aaa;border-radius:9px}
    .page.swap{animation:deal .5s cubic-bezier(.2,.8,.2,1)}@keyframes deal{0%{opacity:0;transform:scale(.97) rotate(.7deg);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
    .history{display:flex;align-items:center;gap:10px;margin-top:18px;overflow:auto;padding-bottom:8px}.history-label{font:500 10px DM Mono;text-transform:uppercase;color:var(--muted);margin-right:5px}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 12px;font:500 11px DM Mono;color:#65645e}.chip:hover{background:#fff}
    .hint{text-align:center;font:400 10px DM Mono;color:#929087;margin-top:2px}
    @media(max-width:650px){header{height:70px;padding:0 18px}.tag,.sound{display:none}.roll{height:44px;padding:0 16px}.stage{padding:20px 12px}.viewport{height:72vh;min-height:510px;border-radius:16px}.meta{padding:0 6px}.address{display:none}}
  </style>

    const ideas=[
      {type:'A tiny space adventure',url:'orbital-garden.fun',render:()=>`<div class="space"><nav><b>ORBITAL<br>GARDEN</b><span>MISSION 04—A</span><span>SECTOR 7G</span></nav><main><div class="planet"><i></i><i></i><i></i></div><div class="copy"><small>TRANSMISSION RECEIVED</small><h1>Grow life<br>among stars.</h1><p>Your seedbank survived the voyage. Find a living planet before the oxygen counter reaches zero.</p><button onclick="this.textContent='SCANNING…';document.querySelector('.planet').classList.toggle('scanning')">BEGIN SCAN →</button></div><div class="stats"><span>O₂ <b>${pick(['72','83','91'])}%</b></span><span>SEEDS <b>${pick(['18','24','31'])}</b></span></div></main></div><style>.space{min-height:100%;background:#10120e;color:#e8f4da;font-family:DM Mono;overflow:hidden}.space nav{height:64px;border-bottom:1px solid #353b2f;display:flex;align-items:center;padding:0 5%;gap:15%;font-size:9px;color:#8f9c85}.space nav b{color:#d6ff61;font-size:11px}.space main{min-height:430px;position:relative;padding:9% 7%}.space .copy{position:relative;z-index:2;width:47%}.space small{color:#d6ff61;font-size:9px}.space h1{font-family:Manrope;font-size:clamp(40px,7vw,88px);line-height:.88;letter-spacing:-.07em;margin:18px 0}.space p{color:#9ca596;font-size:11px;line-height:1.7;max-width:360px}.space button{margin-top:20px;background:#d6ff61;padding:13px 18px;border-radius:2px;font:600 10px DM Mono}.planet{position:absolute;width:45vw;height:45vw;max-width:500px;max-height:500px;border-radius:50%;right:-5%;top:3%;background:radial-gradient(circle at 35% 30%,#a5c38e,#31523d 42%,#12261e 70%);box-shadow:-25px 15px 80px #56866a44}.planet i{position:absolute;border:1px solid #b8ff9755;inset:-8%;border-radius:50%;transform:rotate(30deg)}.planet i:nth-child(2){inset:-18%;transform:rotate(70deg)}.planet.scanning{animation:pulse .7s infinite alternate}@keyframes pulse{to{filter:hue-rotate(70deg);transform:scale(1.02)}}.stats{position:absolute;right:4%;bottom:5%;display:flex;gap:20px;font-size:9px}.stats b{color:#d6ff61}.space @media(max-width:600px){.copy{width:80%}.planet{opacity:.55}}</style>`},
      {type:'A brutalist design portfolio',url:'mara-studio.work',render:()=>`<div class="folio"><nav><b>MARA / ${new Date().getFullYear()}</b><span>DESIGN + DIRECTION</span><button>MENU ↗</button></nav><div class="ticker">SELECTED WORK — SELECTED WORK — SELECTED WORK —</div><section><div><small>01 / IDENTITY</small><h1>FORM<br>FOLLOWS<br><em>FEELING.</em></h1></div><div class="poster"><div class="shape"></div><b>${pick(['OBJECTS IN MOTION','SOFT SYSTEMS','A NEW FREQUENCY'])}</b><small>2024—2026</small></div></section></div><style>.folio{min-height:100%;background:#f0eddf;color:#171713;text-transform:uppercase}.folio nav{display:flex;justify-content:space-between;padding:18px 3%;border-bottom:2px solid #111;font:700 10px DM Mono}.folio nav button{background:none;font:700 10px DM Mono}.ticker{background:#ff4c22;padding:8px;white-space:nowrap;overflow:hidden;font:500 10px DM Mono;word-spacing:45px}.folio section{display:grid;grid-template-columns:1.15fr .85fr;min-height:430px}.folio section>div{padding:5%;border-right:2px solid #111}.folio small{font:500 9px DM Mono}.folio h1{font-size:clamp(48px,8vw,110px);line-height:.76;letter-spacing:-.08em;margin:28px 0}.folio h1 em{font-family:Georgia;font-weight:400;text-transform:none}.poster{background:#b8c7ff;position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.poster .shape{width:75%;aspect-ratio:1;position:absolute;top:3%;left:12%;border-radius:50% 10% 50% 10%;background:#171713;transform:rotate(20deg);transition:.5s}.poster:hover .shape{border-radius:50%;transform:rotate(100deg) scale(.8);background:#ff4c22}.poster b{font-size:clamp(18px,3vw,38px);line-height:.9;position:relative}.poster small{position:relative;margin-top:10px}@media(max-width:600px){.folio section{grid-template-columns:1fr}.folio .poster{min-height:300px}}</style>`},
      {type:'A suspiciously addictive game',url:'stackattack.game',render:()=>`<div class="game"><header><b>STACK<br>ATTACK!</b><div>BEST<br><strong id="best">${pick([1200,1850,2400])}</strong></div></header><main><div class="score"><small>SCORE</small><b id="score">0000</b></div><div class="tower" id="tower"><i style="width:140px"></i><i style="width:120px"></i><i style="width:92px"></i></div><button id="stack" onclick="let s=document.querySelector('#score');s.textContent=String(+s.textContent+100).padStart(4,'0');let t=document.querySelector('#tower'),i=document.createElement('i');i.style.width=(50+Math.random()*90)+'px';t.prepend(i)">DROP BLOCK <span>SPACE</span></button><p>Stack as high as you can.<br>Don't let it tumble.</p></main></div><style>.game{min-height:100%;background:#ffcf38;color:#1b1934;font-family:DM Mono}.game header{height:75px;padding:14px 5%;display:flex;justify-content:space-between;border-bottom:3px solid #1b1934}.game header b{font:900 18px/ .8 Manrope;transform:rotate(-3deg)}.game header div{text-align:right;font-size:8px}.game header strong{font-size:16px}.game main{display:flex;min-height:430px;align-items:center;justify-content:center;flex-direction:column;position:relative;background:linear-gradient(#ffcf38 70%,#f05a4d 70%)}.score{position:absolute;top:24px;text-align:center}.score small{font-size:8px}.score b{display:block;font-size:38px}.tower{height:245px;width:190px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.tower i{height:29px;background:#4c49a2;border:3px solid #1b1934;box-shadow:4px 4px 0 #1b1934;display:block;animation:drop .25s}@keyframes drop{from{transform:translateY(-180px)}}.tower i:nth-child(even){background:#f6eee3}.game main button{background:#1b1934;color:#fff;padding:14px 18px;border-radius:6px;box-shadow:5px 5px 0 #fff}.game button span{margin-left:20px;color:#ffcf38;font:500 8px DM Mono}.game p{position:absolute;right:4%;bottom:3%;font-size:9px}</style>`},
      {type:'A calm, very focused search page',url:'findanything.today',render:()=>`<div class="searchy"><nav><b>O</b><span>About &nbsp; Images</span><button>Sign in</button></nav><main><h1>orbit.</h1><div class="searchbox"><span>⌕</span><input placeholder="What are you looking for?" autofocus><button onclick="document.querySelector('.searchy h1').textContent=pickWord()">→</button></div><div class="quick">Try: <button>why cats purr</button><button>weather on mars</button><button>something beautiful</button></div><p>Quietly indexing ${pick(['18,204,119','24,950,072','31,441,008'])} corners of the web.</p></main><footer><span>Carbon neutral since Tuesday</span><span>Privacy &nbsp; Settings</span></footer></div><style>.searchy{min-height:100%;font-family:Manrope;background:#faf9f5;color:#292b2e;display:flex;flex-direction:column}.searchy nav{display:flex;align-items:center;gap:22px;padding:15px 4%;font-size:10px}.searchy nav b{font-size:25px;color:#4d6cfa;margin-right:auto}.searchy nav button{background:#4d6cfa;color:#fff;padding:9px 15px;border-radius:99px;font-size:9px}.searchy main{min-height:375px;display:flex;align-items:center;flex-direction:column;justify-content:center}.searchy h1{font-family:Georgia;font-weight:400;color:#4d6cfa;font-size:clamp(58px,10vw,115px);letter-spacing:-.08em;margin:0 0 25px}.searchbox{width:min(550px,84%);height:52px;border:1px solid #d4d4d0;border-radius:99px;display:flex;align-items:center;padding:0 10px 0 20px;box-shadow:0 8px 30px #3331}.searchbox input{border:0;outline:0;background:none;flex:1;padding:10px;font:400 12px Manrope}.searchbox button{width:35px;height:35px;border-radius:50%;background:#d9ff65}.quick{font-size:9px;color:#888;margin-top:16px}.quick button{background:#eeeef4;border-radius:99px;padding:7px 10px;margin:3px;font-size:8px}.searchy main p{font:400 8px DM Mono;color:#aaa;margin-top:35px}.searchy footer{margin-top:auto;display:flex;justify-content:space-between;padding:14px 4%;background:#eeede8;font-size:8px}</       {type:'A cozy corner of the internet',url:'slowmornings.cafe',render:()=>`<div class="cafe"><nav><b>SLOW<br>MORNINGS</b><span>MENU</span><span>OUR STORY</span><i></i><button>BAG (0)</button></nav><main><div class="words"><small>ROASTED WITH PATIENCE</small><h1>Take your<br>sweet time.</h1><p>Small-batch coffee for unhurried mornings, long conversations, and nowhere else to be.</p><button onclick="this.textContent='ADDED TO BAG ✓'">SHOP THE ROAST →</button></div><div class="cup"><div>sm<br>☻</div><span></span></div><aside><b>${pick(['HONEY / FIG / COCOA','CHERRY / TOFFEE / PLUM','CITRUS / CACAO / MALT'])}</b><small>THIS WEEK'S POUR</small></aside></main></div><style>.cafe{min-height:100%;background:#e7a871;color:#50271d}.cafe nav{height:70px;display:flex;align-items:center;padding:0 4%;gap:4%;border-bottom:1px solid #874f3d;font:700 9px DM Mono}.cafe nav b{font:800 13px/.85 Manrope}.cafe nav i{flex:1}.cafe nav button{background:none;color:inherit;font:700 9px DM Mono}.cafe main{min-height:430px;position:relative;padding:8% 6%;overflow:hidden}.words{width:52%;position:relative;z-index:2}.cafe small{font:500 8px DM Mono}.cafe h1{font-family:Georgia;font-size:clamp(46px,8vw,95px);line-height:.87;letter-spacing:-.06em;margin:15px 0}.cafe p{font-size:11px;line-height:1.6;max-width:370px}.words button{background:#50271d;color:#f3c89f;padding:13px 17px;margin-top:15px;font:600 9px DM Mono}.cup{position:absolute;right:8%;top:8%;width:30vw;height:30vw;max-width:330px;max-height:330px;background:#f2d6ad;border-radius:5% 5% 40% 40%;box-shadow:15px 15px 0 #b56f50;display:grid;place-items:center;font:800 42px/.7 Manrope;text-align:center;transform:rotate(6deg)}.cup span{position:absolute;width:30%;height:45%;border:18px solid #f2d6ad;right:-27%;border-radius:50%;z-index:-1}.cafe aside{position:absolute;bottom:4%;right:5%;text-align:right}.cafe aside b,.cafe aside small{display:block;font:600 9px DM Mono}.cafe aside small{opacity:.6;margin-top:5px}</style>`},
      {type:'A neon reflex game',url:'zap-the-dot.arcade',render:()=>`<div class="zap"><nav><b>ZAP!</b><span>HIT THE DOT BEFORE IT MOVES</span><strong id="zs">0 PTS</strong></nav><main id="arena"><button class="target" onclick="let s=document.querySelector('#zs'),n=+s.textContent.split(' ')[0]+1,right=Math.random()>.5;s.textContent=n+' PTS';this.style.left=(right?58+Math.random()*28:8+Math.random()*35)+'%';this.style.top=(right?8+Math.random()*70:7+Math.random()*30)+'%'">●</button><div class="zapcopy"><small>QUICK HANDS ONLY</small><h1>Catch<br>me.</h1></div></main></div><style>.zap{min-height:100%;background:#090713;color:#e9ff44;font-family:DM Mono}.zap nav{height:58px;border-bottom:1px solid #39334f;display:flex;align-items:center;padding:0 4%;gap:8%;font-size:9px}.zap nav b{font:900 24px Manrope;color:#ff4edb}.zap nav strong{margin-left:auto}.zap main{height:430px;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 30%,#352076,#090713 55%)}.zapcopy{position:absolute;left:6%;bottom:8%;pointer-events:none}.zap h1{font:800 clamp(62px,11vw,130px)/.7 Manrope;letter-spacing:-.08em;margin:10px 0}.target{position:absolute;left:70%;top:30%;width:62px;height:62px;border-radius:50%;background:#ff4edb;color:#fff;box-shadow:0 0 0 12px #ff4edb22,0 0 35px #ff4edb;transition:.15s;font-size:20px}.target:hover{transform:scale(1.12)}</style>`},
      {type:'A dreamy music player',url:'afterglow.fm',render:()=>`<div class="radio"><nav><b>AFTERGLOW.FM</b><span>LIVE FROM SOMEWHERE QUIET</span><i>● ON AIR</i></nav><main><div class="disc"><span>AFTER<br>GLOW</span></div><section><small>NOW DRIFTING</small><h1>${pick(['Blue Hour','Soft Static','Moonlit Drive'])}</h1><p>${pick(['Mira Vale','The Night Gardens','Polaroid Weather'])}</p><div class="wave">▂▅▃▇▄▂▆▃▅▇▂▄▆▃▂▅</div><button onclick="this.textContent=this.textContent==='▶'?'Ⅱ':'▶';document.querySelector('.disc').classList.toggle('spin')">▶</button></section></main></div><style>.radio{min-height:100%;background:#171638;color:#f4eaf6}.radio nav{height:60px;display:flex;align-items:center;padding:0 4%;font:500 9px DM Mono;border-bottom:1px solid #454369}.radio nav span{margin:auto}.radio nav i{color:#ff6b9d}.radio main{min-height:430px;display:flex;align-items:center;justify-content:center;gap:8%;background:linear-gradient(135deg,#171638,#663c68)}.disc{width:min(34vw,280px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#191729 0 4px,#2e2948 5px 7px);display:grid;place-items:center;box-shadow:20px 25px 60px #0008}.disc span{width:34%;aspect-ratio:1;border-radius:50%;background:#ff8b75;display:grid;place-items:center;text-align:center;font:700 10px DM Mono}.disc.spin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.radio section{width:38%}.radio section small{font:500 8px DM Mono;color:#ffb0c8}.radio h1{font:500 clamp(38px,6vw,76px)/.9 Georgia;margin:18px 0 5px}.radio p{font-size:11px;color:#bdb5ca}.wave{font:400 18px DM Mono;letter-spacing:5px;color:#ffb0c8;margin:28px 0}.radio section button{width:52px;height:52px;border-radius:50%;background:#f4eaf6;color:#171638}@media(max-width:600px){.radio main{flex-direction:column;gap:25px}.radio .disc{width:190px}.radio section{width:80%;text-align:center}}</style>`},
      {type:'A digital pet adoption center',url:'pixelpals.pet',render:()=>`<div class="pets"><nav><b>PIXEL PALS</b><span>ADOPT A FRIEND MADE OF BITS</span><button>MY PETS ♡</button></nav><main><div class="pet" id="pet"><i></i><b>•ᴗ•</b></div><section><small>READY TO COME HOME</small><h1 id="petname">${pick(['Mochi','Beans','Pickle','Nori'])}</h1><p>Level 1 cloud creature<br>Loves snacks and tiny songs.</p><div><button onclick="document.querySelector('#pet').classList.add('happy');this.textContent='ADOPTED! ♥'">ADOPT ME</button><button onclick="document.querySelector('#petname').textContent=pick(['Mochi','Beans','Pickle','Nori']);document.querySelector('#pet').classList.remove('happy')">MEET ANOTHER ↻</button></div></section></main></div><style>.pets{min-height:100%;background:#dff6f0;color:#173c3c}.pets nav{height:62px;display:flex;align-items:center;padding:0 4%;font:600 9px DM Mono;border-bottom:2px dashed #78aaa0}.pets nav span{margin:auto}.pets nav button{background:#173c3c;color:#fff;padding:9px 13px;border-radius:4px;font:600 8px DM Mono}.pets main{min-height:430px;display:flex;align-items:center;justify-content:center;gap:8%}.pet{width:min(35vw,280px);aspect-ratio:1;background:#ffcae0;border:4px solid #173c3c;border-radius:48% 48% 42% 42%;box-shadow:12px 12px 0 #78aaa0;display:grid;place-items:center;position:relative;transition:.4s}.pet b{font:800 clamp(34px,6vw,65px) DM Mono}.pet i,.pet:after{content:'';position:absolute;width:28%;height:34%;background:#ffcae0;border:4px solid #173c3c;top:-13%;left:6%;transform:rotate(-22deg);border-radius:70% 20%;z-index:-1}.pet:after{left:auto;right:6%;transform:rotate(22deg)}.pet.happy{transform:rotate(-6deg) scale(1.06);background:#fff07c}.pets section small{font:600 8px DM Mono}.pets h1{font:800 clamp(52px,8vw,90px)/.8 Manrope;letter-spacing:-.06em;margin:18px 0}.pets p{font:400 10px/1.7 DM Mono}.pets section button{padding:12px 15px;margin:12px 6px 0 0;background:#173c3c;color:#fff;font:600 8px DM Mono}.pets section       {type:'A breaking-news parody',url:'the-daily-whatever.news',render:()=>`<div class="news"><header><span>${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span><h1>THE DAILY WHATEVER</h1><button>☰</button></header><div class="alert">BREAKING: LOCAL PERSON ROLLS A VERY GOOD WEBSITE</div><main><article><small>TECHNOLOGY / 2 MIN READ</small><h2>${pick(['Scientists Confirm Button Still Fun To Press','Internet Discovers Another Shade of Blue','Tiny Website Wins Extremely Large Award'])}</h2><p>Experts are calling it “a surprisingly delightful development.” More updates are expected after one more roll.</p><button onclick="this.closest('article').querySelector('p').textContent='UPDATE: Sources confirm you clicked the button. The situation remains charming.'">READ UPDATE →</button></article><aside><div></div><b>LIVE SCENE</b><span>▲ ${pick(['12','29','47'])} viewers</span></aside></main></div><style>.news{min-height:100%;background:#faf7ef;color:#171717}.news header{padding:14px 3%;display:flex;align-items:center;border-bottom:4px double #111}.news header span{font:500 8px DM Mono;width:25%}.news header h1{font:900 clamp(18px,4vw,42px) Georgia;margin:0;text-align:center;flex:1}.news header button{width:25%;text-align:right;background:none}.alert{background:#da2d23;color:#fff;padding:7px;text-align:center;font:700 8px DM Mono;letter-spacing:.08em}.news main{display:grid;grid-template-columns:1.2fr .8fr;min-height:430px}.news article{padding:7%;border-right:1px solid #aaa}.news article small{font:600 8px DM Mono;color:#ba261e}.news h2{font:800 clamp(40px,6vw,76px)/.9 Georgia;letter-spacing:-.04em;margin:18px 0}.news p{font:400 12px/1.6 Georgia;max-width:550px}.news article button{border-bottom:2px solid #111;background:none;padding:10px 0;font:700 8px DM Mono}.news aside{padding:8%;font:500 8px DM Mono}.news aside div{height:75%;background:linear-gradient(25deg,#888,#ddd);filter:grayscale(1);position:relative}.news aside div:after{content:'LIVE';position:absolute;top:10px;left:10px;background:#d22;color:#fff;padding:5px}.news aside b,.news aside span{display:inline-block;margin:10px 8px 0 0}@media(max-width:600px){.news main{grid-template-columns:1fr}.news aside{display:none}}</style>`}
    ];
    window.pickWord=()=>pick(['wonder.','discover.','wander.','ask.']);
    function beep(){if(!soundOn)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(180,a.currentTime);o.frequency.exponentialRampToValueAtTime(480,a.currentTime+.12);g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);o.start();o.stop(a.currentTime+.17)}catch(e){}}
    function roll(specific){const idea=specific||pick(ideas);rolls++;beep();typeEl.textContent=idea.type;address.textContent=idea.url;count.textContent='ROLL '+String(rolls).padStart(3,'0');page.classList.remove('swap');void page.offsetWidth;page.innerHTML=idea.render();page.classList.add('swap');history.unshift(idea);history=history.slice(0,4);renderHistory()}
    function renderHistory(){historyEl.innerHTML='<span class="history-label">Recent rolls</span>'+history.map((x,i)=>`<button class="chip" data-i="${i}">${x.type.replace(/^A /,'')}</button>`).join('');historyEl.querySelectorAll('button').forEach(b=>b.onclick=()=>roll(history[+b.dataset.i]))}
    document.querySelector('#roll').onclick=()=>roll();document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'◒':'○'};addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();roll()}});roll(ideas[0]);
